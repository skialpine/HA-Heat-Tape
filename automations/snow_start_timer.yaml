alias: Snow – Start 12-day timer on Pirate Weather snow or manual ON
description: "Starts 12-day timer when Pirate Weather reports snow (state contains 'snow') for at least 10 minutes, or when manually enabled"
mode: restart

trigger:
  # Require 'snowy', 'snow', 'light_snow', etc. for 10 minutes
  - platform: template
    value_template: >
      {{ states('weather.pirateweather') | lower | contains('snow') }}
    for:
      minutes: 10

  # Manual activation from dashboard
  - platform: state
    entity_id: input_boolean.snow_in_last_12_days
    to: "on"

condition: []

action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.snow_in_last_12_days

  - service: timer.start
    target:
      entity_id: timer.snow_recent_12d_timer
