alias: Snow – Start 12-day timer on Pirate Weather snow or manual ON
description: "Starts 12-day timer when Pirate Weather shows meaningful snow (state or intensity/accumulation) for at least 10 minutes, or when manually enabled"
mode: restart

trigger:
  - platform: template
    value_template: >
      {% set cond = states('weather.pirateweather') | lower %}
      {% set rate = states('sensor.pirateweather_precip_intensity') | float(0) %}
      {% set accum = states('sensor.pirateweather_current_day_snow_accumulation') | float(0) %}
      {{ 'snow' in cond or rate > 0.02 or (accum > 0 and rate > 0) }}
    for:
      minutes: 10

  - platform: state
    entity_id: input_boolean.snow_in_last_12_days
    to: "on"

condition: []

action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.snow_in_last_12_days
  - service: timer.start
    target:
      entity_id: timer.snow_recent_12d_timer
