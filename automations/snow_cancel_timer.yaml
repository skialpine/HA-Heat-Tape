alias: Snow – Cancel 12-day timer on manual OFF
description: "Cancels snow_recent_12d_timer if the helper is turned off manually"
mode: single

trigger:
  - platform: state
    entity_id: input_boolean.snow_in_last_12_days
    from: "on"
    to: "off"

action:
  - service: timer.cancel
    target:
      entity_id: timer.snow_recent_12d_timer
