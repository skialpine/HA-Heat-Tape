# Heat Tape package: keeps heat-tape automations in GitHub while allowing UI automations
# to remain managed in automations.yaml.
#
# Install:
# 1) Put this file at: /config/packages/heat_tape_package.yaml
# 2) Ensure configuration.yaml contains:
#      homeassistant:
#        packages: !include_dir_named packages
# 3) Restart Home Assistant

automation:

  # -----------------------------
  # Freeze / Heat Tape control
  # -----------------------------

  - id: heat_tape_freeze_latch_on
    alias: "Heat Tape – Freeze – Latch ON when between 25F and 39F"
    description: >
      Enable freeze latch only when temps are in melt band, off-peak daylight, and snow was recent.
      Checks hourly forecast before latching — skips startup if temps will rise above 39°F within
      2 hours, since natural melting will dominate shortly and running the tape is wasteful.
      Falls back safely if forecast data is unavailable (proceeds with turn-on).
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.pirateweather_temperature
        above: 25
      - platform: numeric_state
        entity_id: sensor.pirateweather_temperature
        below: 39
      - platform: time
        at: "06:00:00"
    condition:
      - condition: time
        after: "06:00:00"
        before: "15:55:00"
      - condition: numeric_state
        entity_id: sensor.pirateweather_temperature
        above: 25
      - condition: numeric_state
        entity_id: sensor.pirateweather_temperature
        below: 39
      - condition: state
        entity_id: input_boolean.snow_in_last_12_days
        state: "on"
    action:
      - condition: state
        entity_id: input_boolean.freeze_latch
        state: "off"
      - service: weather.get_forecasts
        target:
          entity_id: weather.pirateweather
        data:
          type: hourly
        response_variable: forecast_data
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {% set forecasts = forecast_data['weather.pirateweather']['forecast'] %}
                  {% set t1 = forecasts[0].temperature | float(0) if forecasts | length > 0 else 0 %}
                  {% set t2 = forecasts[1].temperature | float(0) if forecasts | length > 1 else 0 %}
                  {{ t1 <= 39 and t2 <= 39 }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.freeze_latch
              - service: switch.turn_on
                target:
                  entity_id: switch.heat_tape
          # No default: if forecast shows temps rising above 39F within 2h, skip startup.
          # Natural melting will handle it. The automation re-evaluates if temp stays in band.

  - id: heat_tape_freeze_maintain_latched
    alias: "Heat Tape – Freeze – Maintain ON while latched"
    description: "Enforce heat tape state based on time window, melt band (25–39F), and recent snow."
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.freeze_latch
        to: "on"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: switch.heat_tape
        to: "off"
      - platform: state
        entity_id: input_boolean.snow_in_last_12_days
      - platform: numeric_state
        entity_id: sensor.pirateweather_temperature
        above: 39
        for: "01:00:00"
      - platform: numeric_state
        entity_id: sensor.pirateweather_temperature
        below: 25
        for: "01:00:00"
      - platform: time
        at: "06:00:00"
      - platform: time
        at: "15:55:00"
    action:
      - choose:
          - conditions:
              - condition: time
                after: "06:00:00"
                before: "15:55:00"
              - condition: state
                entity_id: input_boolean.snow_in_last_12_days
                state: "on"
              - condition: numeric_state
                entity_id: sensor.pirateweather_temperature
                above: 25
              - condition: numeric_state
                entity_id: sensor.pirateweather_temperature
                below: 39
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.freeze_latch
              - service: switch.turn_on
                target:
                  entity_id: switch.heat_tape
        default:
          - service: switch.turn_off
            target:
              entity_id: switch.heat_tape
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.freeze_latch

  - id: heat_tape_freeze_daily_reset
    alias: "Heat Tape – Freeze – Daily reset at 3:55 PM"
    description: "Turn off heat tape and latch before TOU premium starts."
    mode: single
    trigger:
      - platform: time
        at: "15:55:00"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.heat_tape
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.freeze_latch

  # -----------------------------
  # Forecast-aware immediate shutoff (#1)
  # -----------------------------

  - id: heat_tape_forecast_shutoff
    alias: "Heat Tape – Forecast – Immediate shutoff when warming confirmed"
    description: >
      When temperature exceeds 39°F and the next-hour forecast also exceeds 39°F,
      turn off immediately rather than waiting the standard 1-hour delay built into
      "Maintain ON while latched". Saves ~1 hour of runtime per warm day.

      Fails safely: if the forecast service call fails or forecast is uncertain
      (next hour ≤ 39°F), this automation does nothing. The 1-hour delay trigger
      in "Maintain ON" still fires as a backstop.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.pirateweather_temperature
        above: 39
    condition:
      - condition: state
        entity_id: switch.heat_tape
        state: "on"
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.pirateweather
        data:
          type: hourly
        response_variable: forecast_data
      - condition: template
        value_template: >
          {% set forecasts = forecast_data['weather.pirateweather']['forecast'] %}
          {% set next_temp = forecasts[0].temperature | float(0) if forecasts | length > 0 else 0 %}
          {{ next_temp > 39 }}
      - service: switch.turn_off
        target:
          entity_id: switch.heat_tape
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.freeze_latch

  # -----------------------------
  # Snow window (12 days) with reboot-safe tracking
  # -----------------------------

  - id: heat_tape_snow_start_timer
    alias: "Heat Tape – Snow – Start 12-day timer on Pirate Weather snow or manual ON"
    description: >
      Starts or restarts the 12-day snow window when Pirate Weather indicates
      meaningful snowfall (state, intensity, or accumulation) for at least 10 continuous minutes,
      or when manually enabled. Also stamps last snow time for reboot-safe recovery.
    mode: restart
    trigger:
      - platform: template
        id: snow_detected
        value_template: >
          {% set cond = states('weather.pirateweather') | lower %}
          {% set rate = states('sensor.pirateweather_precip_intensity') | float(0) %}
          {% set accum = states('sensor.pirateweather_current_day_snow_accumulation') | float(0) %}
          {{ 'snow' in cond
             or rate > 0.02
             or accum >= 0.2 }}
        for:
          minutes: 10
      - platform: state
        id: manual_on
        entity_id: input_boolean.snow_in_last_12_days
        to: "on"
    action:
      - if:
          - condition: trigger
            id: manual_on
          - condition: template
            value_template: >
              {% set last = states('input_datetime.last_snow_detected') %}
              {% set last_ts = as_timestamp(last) if last not in ['unknown','unavailable','none',''] else 0 %}
              {{ (as_timestamp(now()) - last_ts) < (12 * 24 * 3600) }}
        then:
          - stop: "Skipping re-stamp: boolean restored from recompute, valid snow event already tracked."
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_snow_detected
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.snow_in_last_12_days
      - service: timer.start
        target:
          entity_id: timer.snow_recent_12d_timer

  - id: heat_tape_snow_recompute_on_restart
    alias: "Heat Tape – Snow – Recompute recent-snow window after restart"
    description: >
      On HA restart, recompute whether snow is still "recent" based on input_datetime.last_snow_detected.
      If still within 12 days, re-enable the snow flag and restart the timer with the remaining duration.
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    variables:
      last: "{{ states('input_datetime.last_snow_detected') }}"
      last_ts: "{{ as_timestamp(last) if last not in ['unknown','unavailable','none',''] else 0 }}"
      age_sec: "{{ (as_timestamp(now()) - last_ts) | int }}"
      window_sec: "{{ 12 * 24 * 3600 }}"
      remaining_sec: "{{ window_sec - age_sec if age_sec < window_sec else 0 }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ remaining_sec > 0 }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.snow_in_last_12_days
              - service: timer.start
                target:
                  entity_id: timer.snow_recent_12d_timer
                data:
                  duration: "{{ '%02d:%02d:%02d' | format((remaining_sec|int)//3600, ((remaining_sec|int)%3600)//60, (remaining_sec|int)%60) }}"
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.snow_in_last_12_days
          - service: timer.cancel
            target:
              entity_id: timer.snow_recent_12d_timer

  - id: heat_tape_snow_clear_flag
    alias: "Heat Tape – Snow – Clear flag when 12-day timer ends"
    description: "Turns off snow_in_last_12_days when the 12-day timer finishes."
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.snow_recent_12d_timer
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.snow_in_last_12_days

  - id: heat_tape_snow_cancel_timer
    alias: "Heat Tape – Snow – Cancel 12-day timer on manual OFF"
    description: >
      Cancels the 12-day timer if snow_in_last_12_days is turned off manually.
      Also clears last_snow_detected so a restart doesn't immediately re-enable the window.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.snow_in_last_12_days
        from: "on"
        to: "off"
    action:
      - service: timer.cancel
        target:
          entity_id: timer.snow_recent_12d_timer
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_snow_detected
        data:
          datetime: "1970-01-01 00:00:00"
